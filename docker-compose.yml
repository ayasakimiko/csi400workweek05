services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      MONGO_URI: mongodb://mongo:27017/ProductData
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: MemberDB
      JWT_SECRET: TEST2323
      CORS_ALLOWED_ORIGINS: "http://localhost:5500,http://127.0.0.1:5500,https://api.banka.com,https://api.bankb.com"
    depends_on:
      - mongo
      - mysql

  mongo:
    image: mongo:7
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

  mysql:
    image: mysql:8
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: MemberDB
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/sqltest.sql:/docker-entrypoint-initdb.d/sqltest.sql

  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    depends_on:
      - mysql

volumes:
  mongo_data:
  mysql_data:
