<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Hacker Test - Unauthorized Origin</title>
<link rel="stylesheet" href="HackerTestApi.css">
</head>
<body>

<header>
  <h1>Hacker Client (Unauthorized Origin)</h1>
  <p>จำลองเว็บของผู้ไม่หวังดีที่พยายามดึงข้อมูล Private API จาก origin ที่ไม่ได้รับอนุญาต</p>
</header>

<main>
  <div class="card">
    <h2>วิธีทดสอบให้ origin นี้ "ไม่ได้รับอนุญาต" จริง ๆ</h2>
  </div>

  <div class="card">
    <h2>Target</h2>
    <label>API Base URL ของเหยื่อ</label>
    <input id="apiBase" value="http://localhost:3000">

    <label>JWT token ที่ขโมยมา (ทดสอบว่า origin ผิด ต่อให้มี token จริงก็ยังใช้ไม่ได้)</label>
    <input id="stolenToken" placeholder="วาง token จาก MemberTestApi.html มาแปะที่นี่ก็ได้ (ทดสอบ)">

    <button onclick="attack()">ยิงขโมยข้อมูลทรัพย์สินทั้งหมด (GET /api/assets)</button>
    <button onclick="attackWithToken()">ยิงพร้อมแนบ token</button>
    <button onclick="attackLogin()">ลองสุ่ม login ด้วย admin</button>
  </div>

  <div class="card">
    <h2>Attack Log</h2>
    <div id="log"></div>
  </div>
</main>

<script>
function apiBase() {
  return document.getElementById('apiBase').value.replace(/\/$/, '');
}

function log(kind, title, detail) {
  const el = document.getElementById('log');
  const entry = document.createElement('div');
  entry.className = 'entry ' + kind;
  const time = new Date().toLocaleTimeString();
  entry.innerHTML = `<div class="meta">[${time}] ${title}</div><div>${escapeHtml(detail)}</div>`;
  el.prepend(entry);
}

function escapeHtml(str) {
  return String(str).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
}

function isValidApiBase(base) {
  if (!base) return false;
  try {
    const u = new URL(base);
    return u.protocol === 'http:' || u.protocol === 'https:';
  } catch {
    return false;
  }
}

async function tryFetch(path, options, label) {
  const base = apiBase();
  if (!isValidApiBase(base)) {
    log('blocked', `${label} -> API Base URL ไม่ถูกต้อง`, `"${base}" ไม่ใช่ URL ที่ใช้ได้ ต้องขึ้นต้นด้วย http:// หรือ https:// เช่น http://localhost:3000`);
    return;
  }
  try {
    const res = await fetch(base + path, options);
    const data = await res.json().catch(() => ({}));
    log('leak', `${label} -> HTTP ${res.status} (origin ผ่าน CORS! ตรวจสอบ whitelist ใหม่)`, JSON.stringify(data, null, 2));
  } catch (err) {
    log('blocked', `${label} -> ถูก CORS บล็อก`, 'browser ปฏิเสธไม่ให้อ่าน response: ' + err.message +
      '\n(เปิด DevTools > Console จะเห็น "No \'Access-Control-Allow-Origin\' header" ชัดเจนกว่านี้)');
  }
}

function attack() {
  tryFetch('/api/assets', { method: 'GET' }, 'GET /api/assets (ไม่มี token)');
}

function attackWithToken() {
  const token = document.getElementById('stolenToken').value;
  if (!token) {
    log('blocked', 'GET /api/assets (แนบ stolen token)', 'ยังไม่ได้แนบ token เลยนะ ใส่ token ในช่อง "JWT token ที่ขโมยมา" ก่อนแล้วค่อยกดปุ่มนี้');
    return;
  }
  tryFetch('/api/assets', {
    method: 'GET',
    headers: { Authorization: 'Bearer ' + token },
  }, 'GET /api/assets (แนบ stolen token)');
}

function attackLogin() {
  tryFetch('/api/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: 'tset@gmail.com', password: '999999a' }),
  }, 'POST /api/auth/login (สุ่มรหัสผ่าน)');
}
</script>

</body>
</html>
